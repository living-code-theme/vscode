# Manual only. Publishes this repository's extension to the VS Code Marketplace and Open VSX.
# First create the living-code-theme publisher at https://marketplace.visualstudio.com/manage
# and the living-code-theme namespace at https://open-vsx.org, with publishing access for the token owners.
# Use Living Code as the public display name.
# VSCE_PAT: Azure DevOps token with Marketplace > Manage access for that publisher.
# OVSX_PAT: Open VSX access token with publishing rights to that namespace.
# Both registries use the publisher/name from package.json: living-code-theme.living-code.
name: publish-vscode
on:
  workflow_dispatch:
    inputs:
      marketplace:
        description: Publish to the VS Code Marketplace
        type: boolean
        default: true
      open-vsx:
        description: Publish to Open VSX
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # vsce and ovsx come from the lockfile (exact versions + integrity hashes), never from a floating `dlx`,
      # so a compromised upstream release cannot run while the marketplace tokens are in the environment.
      - name: Install locked publishing tools
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Package the extension
        run: pnpm run package:vscode
      - name: Publish to the VS Code Marketplace
        if: inputs.marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::The VSCE_PAT secret is empty. Add an Azure DevOps token with the Marketplace > Manage scope as a repository secret named VSCE_PAT."
            exit 1
          fi
          pnpm exec vsce publish --packagePath dist/*.vsix
      - name: Publish to Open VSX
        if: inputs.open-vsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::The OVSX_PAT secret is empty. Create an open-vsx.org access token and add it as a repository secret named OVSX_PAT."
            exit 1
          fi
          pnpm exec ovsx publish dist/*.vsix
